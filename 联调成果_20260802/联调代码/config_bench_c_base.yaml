# 小测基座：10 agents × 5 steps（省钱，只为对比 C 的 LLM 旋钮）
# 由 bench_c_llm_variants.py 覆盖 llm_config 后运行
n_agents: 10

agent_type_ratio:
  ORDINARY:    0.70
  ACTIVE:      0.10
  RATIONAL:    0.10
  CONTROLLER:  0.10

group_type_ratio:
  DORM:   0.25
  CLASS:  0.35
  MAJOR:  0.25
  CAMPUS: 0.15

network_type: "barabasi_albert"
network_params:
  m: 2
  group_membership_mode: "hierarchical"
  forward_destination_strategy: "weighted"
  cross_group_spread_probability: 0.15

n_steps: 5

hawkes_params:
  mu:    0.1
  alpha: 0.5
  beta:  1.0

scenario_params:
  intervention_trigger: "negative"
  negative_threshold: 0.65
  heat_threshold: 0.70
  intervention_requires_controller: true
  intervention_min_messages: 2
  inject_initial_event: true
  initial_event_group_scope: "small_or_large"
  initial_event_heat: 0.80
  initial_event_negative: 0.72
  secondary_event_probability: 0.0
  enable_mute: true
  allow_downward_forward: true

llm_config:
  provider: deepseek
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com
  timeout: 60
  max_retries: 2
  temperature: 0.2
  thinking: false
  use_actions: true
  fallback_mock: false
  json_mode: true
  max_tokens: 512
  max_prompt_chars: 6000
  max_memory_items: 4
  max_recent_messages: 6
  max_concurrency: 16
  user_id_prefix: agent

random_seed: 42
